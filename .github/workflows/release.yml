name: Release

# Fires only on a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Enable Corepack (yarn version is pinned by packageManager)
        run: corepack enable
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
      - run: yarn install
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./packages/storybook-addon-webmcp/package.json").version')"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package $pkg" >&2; exit 1; }
      - run: yarn check
      - run: yarn lint:check
      - run: yarn build:addon
      - name: Publish to npm
        working-directory: packages/storybook-addon-webmcp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
