name: Release

# Fires only on a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm trusted publishing: registered on npmjs.com for this repo, workflow
    # release.yml and environment `npm`. No long-lived registry token is used.
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Enable Corepack (yarn version is pinned by packageManager)
        run: corepack enable
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
      - run: yarn install
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./packages/storybook-addon-webmcp/package.json").version')"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package $pkg" >&2; exit 1; }
      - run: yarn check
      - run: yarn lint:check
      - run: yarn build:addon
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node's bundled npm is older.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Publish to npm
        working-directory: packages/storybook-addon-webmcp
        run: npm publish --provenance --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
